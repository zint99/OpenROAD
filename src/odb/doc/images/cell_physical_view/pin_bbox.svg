<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img">
<title>引脚金属与包围盒的区别</title>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e9edf2"/><path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" stroke="#a0acbb" stroke-width="1.3"/></pattern></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#23354b;font-size:17px}</style>
<rect width="960" height="490" fill="white"/>
<text x="35" y="43" text-anchor="start" style="font-size:25px;fill:#23354b">A 的 bounding box 包含两块金属之间的空隙</text>
<rect x="112.0" y="307.99999999999994" width="63.0" height="126.00000000000001" fill="#2878bd" stroke="none" stroke-width="2"/>
<rect x="112.0" y="98.0" width="63.0" height="126.00000000000001" fill="#2878bd" stroke="none" stroke-width="2"/>
<rect x="112.0" y="98.0" width="63.0" height="336.0" fill="none" stroke="#23354b" stroke-width="2" stroke-dasharray="7 5"/>
<text x="228" y="132" text-anchor="start" style="font-size:20px;fill:#23354b">M1 金属：y = 1.30 … 1.60 μm</text>
<line x1="177" y1="150" x2="213" y2="125" stroke="#2878bd" stroke-width="1.5"/>
<text x="228" y="266" text-anchor="start" style="font-size:20px;fill:#23354b">空隙：y = 1.10 … 1.30 μm</text>
<line x1="177" y1="265" x2="213" y2="259" stroke="#23354b" stroke-width="1.5"/>
<text x="228" y="299" text-anchor="start" style="font-size:17px;fill:#64748b">在包围盒内，但不在这两块 pin 金属内</text>
<text x="228" y="389" text-anchor="start" style="font-size:20px;fill:#23354b">M1 金属：y = 0.80 … 1.10 μm</text>
<line x1="177" y1="388" x2="213" y2="382" stroke="#2878bd" stroke-width="1.5"/>
<text x="80" y="472" text-anchor="start" style="font-size:18px;fill:#23354b">两块矩形的 x 范围相同：0.10 … 0.25 μm；此图按比例绘制。</text>
</svg>
