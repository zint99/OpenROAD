<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="515" viewBox="0 0 1080 515" role="img">
<title>R90 变换中的实例原点与左下角</title>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#e9edf2"/><path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" stroke="#a0acbb" stroke-width="1.3"/></pattern></defs>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#23354b;font-size:17px}</style>
<rect width="1080" height="515" fill="white"/>
<text x="30" y="43" text-anchor="start" style="font-size:25px;fill:#23354b">旋转后，实例原点与包围盒左下角可以不同</text>
<rect x="25" y="75" width="500" height="390" fill="#f8fafc" stroke="#e4eaf0" stroke-width="2"/>
<text x="45" y="113" text-anchor="start" style="font-size:23px;fill:#23354b">固定 origin</text>
<rect x="115" y="159.0" width="312.0" height="156.0" fill="#e6edf5" stroke="#23354b" stroke-width="2"/>
<polygon points="323.0,302.0 323.0,282.5 284.0,282.5 284.0,302.0" fill="#2878bd" stroke="#2878bd" stroke-width="1.8"/>
<circle cx="427.0" cy="315" r="5" fill="#cb454e"/>
<rect x="110" y="310" width="10" height="10" fill="#18866a" stroke="none" stroke-width="2"/>
<text x="271" y="145" text-anchor="middle" style="font-size:17px;fill:#23354b">2.4 μm</text>
<text x="40" y="235" text-anchor="start" style="font-size:15px;fill:#23354b">1.2 μm</text>
<text x="271" y="224" text-anchor="middle" style="font-size:27px;fill:#23354b">R90</text>
<text x="45" y="365" text-anchor="start" style="font-size:19px;fill:#18866a">绿色方点  location = (97.6, 200)</text>
<text x="45" y="405" text-anchor="start" style="font-size:19px;fill:#cb454e">红色圆点  origin = (100, 200)</text>
<rect x="555" y="75" width="500" height="390" fill="#f8fafc" stroke="#e4eaf0" stroke-width="2"/>
<text x="575" y="113" text-anchor="start" style="font-size:23px;fill:#23354b">固定 location</text>
<rect x="645" y="159.0" width="312.0" height="156.0" fill="#e6edf5" stroke="#23354b" stroke-width="2"/>
<polygon points="853.0,302.0 853.0,282.5 814.0,282.5 814.0,302.0" fill="#2878bd" stroke="#2878bd" stroke-width="1.8"/>
<circle cx="957.0" cy="315" r="5" fill="#cb454e"/>
<rect x="640" y="310" width="10" height="10" fill="#18866a" stroke="none" stroke-width="2"/>
<text x="801" y="145" text-anchor="middle" style="font-size:17px;fill:#23354b">2.4 μm</text>
<text x="570" y="235" text-anchor="start" style="font-size:15px;fill:#23354b">1.2 μm</text>
<text x="801" y="224" text-anchor="middle" style="font-size:27px;fill:#23354b">R90</text>
<text x="575" y="365" text-anchor="start" style="font-size:19px;fill:#18866a">绿色方点  location = (100, 200)</text>
<text x="575" y="405" text-anchor="start" style="font-size:19px;fill:#cb454e">红色圆点  origin = (102.4, 200)</text>
<text x="30" y="497" text-anchor="start" style="font-size:17px;fill:#23354b">坐标单位：μm。两图各用独立画布；单元的 master 原点为 (0, 0)。</text>
</svg>
